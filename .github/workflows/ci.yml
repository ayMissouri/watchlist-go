# GitHub's official setup-go action supports reading the Go version from go.mod via go-version-file.
# This workflow will run automatically on PRs and on pushes to main.

# Name is the workflow label in Github Actions UI.
name: ci

# on defines the events that trigger the workflow.
on:
  # Opening or updating a PR will trigger the workflow.
  pull_request:
  # Pushing to the main branch will also trigger the workflow.
  push:
    branches:
      - main

# a job runs on a fresh GitHub runner.
jobs:
  test-and-lint:
    # runs-on specifies the type of runner to use.
    runs-on: ubuntu-latest

    # services block spins up a docker container alongside the runner
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: watchlist_test
        ports:
          - 5432:5432
        # healthcheck ensures the job waits until the database is ready before running tests.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/watchlist_test?sslmode=disable

    # steps are the individual tasks that will be executed in the job in order.
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify Go version
        run: go version

      - name: Download dependencies
        run: go mod tidy

      - name: Install swag CLI
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Check swagger docs are up to date
        run: |
          swag init -g cmd/server/main.go -o docs --parseDependency --parseInternal
          git diff --exit-code docs/

      - name: Run migrations
        run: |
          psql postgres://postgres:postgres@localhost:5432/watchlist_test?sslmode=disable \
            -f migrations/001_init.sql \
            -f migrations/002_watchlist.sql
        env:
          PGPASSWORD: postgres

      - name: Run tests
        run: go test ./...
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/watchlist_test?sslmode=disable
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_REDIRECT_URL: http://localhost:8080/auth/callback

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          install-mode: goinstall
          version: v2.1

  deploy:
    # blocked until test-and-lint job completes successfully.
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}