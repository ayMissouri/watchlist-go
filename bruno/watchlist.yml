opencollection: 1.0.0
info:
  name: watchlist
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ''
      port: ''
      auth:
        username: ''
        password: ''
      bypassProxy: ''
  environments:
    - name: local
      variables:
        - name: baseURL
          value: http://localhost:8080
items:
  - info:
      name: auth
      type: folder
      seq: 1
    request:
      auth: inherit
    items:
      - info:
          name: me
          type: http
          seq: 1
        http:
          method: GET
          url: '{{baseURL}}/auth/me'
          auth:
            type: bearer
            token: ''
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
bundled: true
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    exportedAt: '2026-05-07T21:14:32.866Z'
    exportedUsing: Bruno
