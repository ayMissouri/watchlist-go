opencollection: 1.0.0
info:
  name: watchlist
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ''
      port: ''
      auth:
        username: ''
        password: ''
      bypassProxy: ''
  environments:
    - name: local
      variables:
        - name: baseURL
          value: http://localhost:8080
    - name: production
      variables:
        - name: baseURL
          value: https://watchlist-go-production.up.railway.app
items:
  - info:
      name: health
      type: http
      seq: 1
    http:
      method: GET
      url: '{{baseURL}}/health'
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
  - info:
      name: auth
      type: folder
      seq: 2
    request:
      auth: inherit
    items:
      - info:
          name: me
          type: http
          seq: 1
        http:
          method: GET
          url: '{{baseURL}}/auth/me'
          auth:
            type: bearer
            token: ''
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
  - info:
      name: details
      type: folder
      seq: 5
    request:
      auth: inherit
    items:
