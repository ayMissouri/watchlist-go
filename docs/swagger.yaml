host: localhost:8080
info:
  contact:
    name: ayMissouri
    url: https://github.com/ayMissouri/watchlist-go.git
  description: Backend API for tracking movies and TV shows.
  license:
    name: MIT
  title: Watchlist API
  version: "1.0"
paths:
  /auth/callback:
    get:
      description: Handles the Discord redirect, issues a JWT, and redirects to the
        frontend
      parameters:
      - description: OAuth2 code from Discord
        in: query
        name: code
        required: true
        type: string
      - description: CSRF state token
        in: query
        name: state
        required: true
        type: string
      responses:
        "307":
          description: Temporary Redirect
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: OAuth2 callback
      tags:
      - auth
  /auth/login:
    get:
      description: Redirects the user to Discord's OAuth2 login screen
      responses:
        "307":
          description: Temporary Redirect
      summary: Discord OAuth2 login
      tags:
      - auth
  /auth/me:
    get:
      description: Returns the authenticated users profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ayMissouri_watchlist-go_git_internal_models.User'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - auth
  /calendar:
    get:
      description: Returns the user's upcoming releases (unreleased movies and not-yet-aired
        episodes of watchlisted shows), soonest first.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ayMissouri_watchlist-go_git_internal_models.CalendarResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get calendar
      tags:
      - calendar
  /calendar/refresh:
    post:
      description: Re-syncs the user's calendar from their watchlist against the meta
        service, then returns the updated list. Useful right after adding an upcoming
        title.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ayMissouri_watchlist-go_git_internal_models.CalendarResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Refresh calendar
      tags:
      - calendar
  /discover:
    get:
      description: Returns a single catalog of movies/shows. Use `sort` (with optional
        `genre`) for the popular/top-rated catalogs, `year` for one release year,
        or `provider` for a streaming service. `provider` takes precedence over `year`,
        which takes precedence over `sort`. Results are cached for 1 hour.
      parameters:
      - description: Media type
        enum:
        - movie
        - series
        in: query
        name: type
        required: true
        type: string
      - description: Sort order (default popular)
        enum:
        - popular
        - top_rated
        in: query
        name: sort
        type: string
      - description: 'Genre filter, e.g. action, sci-fi (series also: reality-tv,
          talk-show, game-show)'
        in: query
        name: genre
        type: string
      - description: Release year, e.g. 2025 (overrides sort)
        in: query
        name: year
        type: string
      - description: Streaming provider (overrides sort and year)
        enum:
        - netflix
        - hbomax
        - disney
        - prime
        - appletv
        in: query
        name: provider
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ayMissouri_watchlist-go_git_internal_models.DiscoverResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Discover movies or shows
      tags:
      - discover
  /discover/all:
    get:
      description: Returns all four catalogs (popular movies, popular shows, top-rated
        movies, top-rated shows) in a single request. All results are cached for 1
        hour.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ayMissouri_watchlist-go_git_internal_models.DiscoverAllResponse'
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Discover all catalogs
      tags:
      - discover
  /events:
    get:
      description: Returns the user's most recent tracked events, newest first. Useful
        for a transparency/activity feed.
      parameters:
      - default: 50
        description: Max events to return
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ayMissouri_watchlist-go_git_internal_models.EventsResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Recent activity
      tags:
      - events
    post:
      consumes:
      - application/json
      description: Accepts a batch of client-reported events (play/pause, heartbeats,
        page views, etc.) and appends them to the user's activity log. Events with
        an empty or over-long type are skipped.
      parameters:
      - description: Batch of events
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_ayMissouri_watchlist-go_git_internal_models.RecordEventsRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Ingest activity events
      tags:
      - events
  /health:
    get:
      description: Returns API and database status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.HealthResponse'
      summary: Health check
      tags:
      - system
  /meta/movie/{id}:
    get:
      description: Returns full metadata for a movie by ID. Results are cached for
        24 hours.
      parameters:
      - description: ID (e.g. tt0111161)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ayMissouri_watchlist-go_git_internal_models.MovieDetail'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get movie details
      tags:
      - meta
  /meta/series/{id}:
    get:
      description: Returns full metadata for a series by ID, including all episodes
        in the videos array. Results are cached for 24 hours.
      parameters:
      - description: ID (e.g. tt3322312)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ayMissouri_watchlist-go_git_internal_models.SeriesDetail'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get series details
      tags:
      - meta
  /notifications:
    get:
      description: Returns the user's most recent notifications plus the unread count
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ayMissouri_watchlist-go_git_internal_models.NotificationsResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List notifications
      tags:
      - notifications
  /notifications/{id}/read:
    patch:
      description: Marks a single notification as read
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Mark a notification read
      tags:
      - notifications
  /notifications/read-all:
    patch:
      description: Marks every unread notification for the user as read
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Mark all notifications read
      tags:
      - notifications
  /search:
    get:
      description: Searches for movies and/or shows by query string. With no type
        filter, returns mixed results weighted by recency.
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      - description: Filter by type
        enum:
        - movie
        - series
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ayMissouri_watchlist-go_git_internal_models.SearchResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Search movies and shows
      tags:
      - search
  /stats:
    get:
      description: 'Returns the authenticated user''s all-time activity summary: totals,
        watch time, top genres and top titles.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ayMissouri_watchlist-go_git_internal_models.ProfileStats'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Profile stats
      tags:
      - stats
  /stats/wrapped:
    get:
      description: 'Returns the authenticated user''s "wrapped" stats for a year:
        watch time, counts, top genres/titles/decades, monthly/hourly/weekday histograms,
        streaks and night-owl flag. Defaults to the current year.'
      parameters:
      - default: 2026
        description: Calendar year (UTC)
        in: query
        name: year
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ayMissouri_watchlist-go_git_internal_models.WrappedStats'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Year in review
      tags:
      - stats
  /watchlist:
    delete:
      consumes:
      - application/json
      description: Deletes multiple watchlist items by ID in a single request
      parameters:
      - description: List of item IDs to delete
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_ayMissouri_watchlist-go_git_internal_models.BulkDeleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              format: int64
              type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Bulk delete watchlist items
      tags:
      - watchlist
    get:
      description: Returns a paginated, filterable list of watchlist items
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: per_page
        type: integer
      - description: Filter by type
        enum:
        - tv
        - movie
        in: query
        name: type
        type: string
      - description: Filter by status
        enum:
        - watching
        - watched
        - plan_to_watch
        - paused
        - dropped
        in: query
        name: status
        type: string
      - description: Sort field
        enum:
        - last_updated
        - title
        in: query
        name: sort
        type: string
      - description: Sort order
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ayMissouri_watchlist-go_git_internal_models.WatchlistResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get watchlist
      tags:
      - watchlist
  /watchlist/{id}:
    delete:
      description: Deletes a watchlist item by ID
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Remove watchlist item
      tags:
      - watchlist
    get:
      description: Returns a single watchlist item by ID
      parameters:
      - description: Item ID (e.g. t63174 or m533535)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ayMissouri_watchlist-go_git_internal_models.WatchlistItem'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get watchlist item
      tags:
      - watchlist
    put:
      consumes:
      - application/json
      description: Creates or fully replaces a watchlist item
      parameters:
      - description: Item ID (e.g. t63174 or m533535)
        in: path
        name: id
        required: true
        type: string
      - description: Watchlist item
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_ayMissouri_watchlist-go_git_internal_models.WatchlistItem'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Add or update watchlist item
      tags:
      - watchlist
  /watchlist/{id}/progress:
    patch:
      consumes:
      - application/json
      description: Lightweight progress-only update without replacing the full item
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      - description: Progress update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_ayMissouri_watchlist-go_git_internal_models.UpdateProgressRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update item progress
      tags:
      - watchlist
  /watchlist/{id}/status:
    patch:
      consumes:
      - application/json
      description: Sets the watch status of an item (watching, watched, plan_to_watch,
        paused, dropped)
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      - description: Status update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_ayMissouri_watchlist-go_git_internal_models.UpdateStatusRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update item status
      tags:
      - watchlist
securityDefinitions:
  BearerAuth:
    description: 'Enter your JWT token as: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
